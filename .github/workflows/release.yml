# Tag v*.*.* → volta a correr testes e auditorias no código dessa versão (sem Docker).
# Publicação em produção: ver CONTRIBUTING.md — comece com atualização manual no servidor.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff (pasta tests/)
        run: |
          set -euxo pipefail
          python -m ruff check tests --fix
          if ! git diff --quiet -- tests/; then
            echo "::error::Ruff: correções pendentes em tests/. Rode: python -m ruff check tests --fix"
            git diff -- tests/
            exit 1
          fi
      - run: python -m pytest tests -q
      - run: python -m pip_audit -r requirements.txt --desc on
      - run: python -m bandit -c bandit.yaml -r . -lll -q

  lembrete-producao:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Versão validada pelo CI
        run: |
          echo "Tag ${{ github.ref_name }} passou nas verificações (testes, lint em tests/, auditoria)."
          echo "No servidor de produção: faça git pull do commit desta tag (ou checkout da tag),"
          echo "atualize o venv se necessário (pip install -r requirements.txt) e reinicie o Streamlit."
          echo "Docker é opcional para mais tarde — não é obrigatório."
