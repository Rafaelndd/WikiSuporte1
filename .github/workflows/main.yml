# CI: pull requests e pushes na branch principal — testes, lint (escopo tests/), dependências e Bandit HIGH.
name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências (app + desenvolvimento)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff (pasta tests/)
        run: python -m ruff check tests

      - name: Pytest
        run: python -m pytest tests -q

      - name: pip-audit (requirements.txt)
        run: python -m pip_audit -r requirements.txt --desc on

      - name: Bandit (apenas severidade HIGH)
        run: python -m bandit -c bandit.yaml -r . -lll -q
