<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — WikiSuporte 2.0</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
        }
        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-6);
            width: 100%;
            max-width: 420px;
            padding: var(--space-4);
        }
        .login-card {
            width: 100%;
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
            box-shadow: var(--shadow-lg);
        }
        .login-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }
        .login-logo img { width: 56px; height: 56px; }
        .login-logo h1 { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
        .login-logo span { font-size: 0.875rem; color: var(--text-muted); }
        .login-error {
            display: none;
            background: var(--danger-light);
            color: var(--danger);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            margin-bottom: var(--space-4);
        }
        .login-footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <img src="assets/logo.svg" alt="WikiSuporte 2.0">
                <h1>WikiSuporte 2.0</h1>
                <span>Plataforma de Gestão e Suporte</span>
            </div>

            <div id="login-error" class="login-error" role="alert"></div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email" class="form-label">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-input"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="senha" class="form-label">Senha</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            class="form-input"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="input-icon-btn"
                            onclick="togglePasswordVisibility()"
                            title="Mostrar/ocultar senha"
                        >👁</button>
                    </div>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary btn-full">
                    Entrar
                </button>
            </form>
        </div>
        <p class="login-footer">WikiSuporte 2.0 &copy; 2025 — Uso interno</p>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Redirecionar se já estiver logado
        if (localStorage.getItem('access_token')) {
            window.location.href = 'index.html';
        }

        async function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            btn.disabled = true;
            btn.textContent = 'Entrando...';
            errorEl.style.display = 'none';

            try {
                const data = await API.post('/api/auth/login', { email, senha });
                localStorage.setItem('access_token', data.access_token);
                localStorage.setItem('refresh_token', data.refresh_token);
                window.location.href = 'index.html#/dashboard';
            } catch (err) {
                errorEl.textContent = err.message || 'E-mail ou senha incorretos.';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        }

        function togglePasswordVisibility() {
            const input = document.getElementById('senha');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
