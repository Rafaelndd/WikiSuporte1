<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiSuporte 2.0</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/kanban.css">
    <link rel="stylesheet" href="css/crm.css">
</head>
<body>
    <div id="app" class="app-layout">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <img src="assets/logo.svg" alt="WikiSuporte 2.0" class="sidebar-logo">
                <button id="sidebar-toggle" class="sidebar-toggle" title="Recolher menu">&#9776;</button>
            </div>
            <nav id="sidebar-nav" class="sidebar-nav"></nav>
            <div class="sidebar-footer">
                <div id="user-info" class="user-info"></div>
                <button id="logout-btn" class="btn btn-ghost btn-sm" onclick="logout()">
                    Sair
                </button>
            </div>
        </aside>

        <!-- Conteúdo principal -->
        <main id="main-content" class="main-content">
            <header class="top-bar">
                <div id="page-title" class="page-title">Dashboard</div>
                <div class="top-bar-actions" id="top-bar-actions"></div>
            </header>
            <div id="page-content" class="page-content">
                <div class="loading-spinner">Carregando...</div>
            </div>
        </main>
    </div>

    <!-- Modal genérico -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-container" class="modal-container"></div>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils/dates.js"></script>
    <script src="js/utils/permissions.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/table.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/kanban.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/tarefas.js"></script>
    <script src="js/pages/crm.js"></script>
    <script src="js/pages/suporte.js"></script>
    <script src="js/pages/configuracoes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
